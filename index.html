<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استلام وصرف أصناف الأوردر</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap');
    body { 
      font-family: 'Tajawal', sans-serif; 
      background-color: #f4f6f9; 
      margin: 0; 
      padding: 12px; 
      direction: rtl; 
    }
    .form-card { 
      background: #ffffff; 
      padding: 18px; 
      border-radius: 12px; 
      max-width: 520px; 
      margin: auto; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
      border-top: 5px solid #8c6239; 
    }
    .logo-container {
      text-align: center;
      margin-bottom: 12px;
    }
    .logo-img {
      max-width: 110px;
      height: auto;
      margin-bottom: 5px;
    }
    .form-title {
      text-align: center; 
      color: #8c6239; 
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 20px;
      font-weight: 700;
    }
    .info-box { 
      background-color: #faf8f5; 
      border: 1px dashed #d1c2b2; 
      border-radius: 8px; 
      padding: 12px 14px; 
      margin-bottom: 15px; 
      font-size: 13px; 
    }
    .info-row { 
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 6px; 
      border-bottom: 1px dotted #e8dec8;
      padding-bottom: 4px;
    }
    .info-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .info-label { 
      font-weight: 700; 
      color: #8c6239; 
    }
    .receive-table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 10px; 
      font-size: 13px; 
    }
    .receive-table th { 
      background-color: #8c6239; 
      color: #ffffff; 
      padding: 8px 4px; 
      text-align: center; 
      font-size: 12px;
    }
    .receive-table td { 
      padding: 8px 4px; 
      border: 1px solid #e0e0e0; 
      text-align: center; 
    }
    .btn-submit { 
      width: 100%; 
      background-color: #8c6239; 
      color: white; 
      border: none; 
      padding: 12px; 
      border-radius: 6px; 
      font-weight: 700; 
      font-size: 15px; 
      cursor: pointer; 
      margin-top: 20px; 
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #724f2d;
    }
    .item-checkbox { 
      width: 18px; 
      height: 18px; 
      accent-color: #8c6239; 
      cursor: pointer;
    }
    .item-checkbox:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }
  </style>
</head>

  const urlParams = new URLSearchParams(window.location.search);
  const orderId = urlParams.get('order_id');
  document.getElementById('disp_order_id').innerText = orderId || 'غير محدد';

  // 2. رابط الـ Webhook الأول للجلب (ضع رابط Production المباشر هنا)
  const GET_ITEMS_WEBHOOK = 'https://saas123456.app.n8n.cloud/webhook/74055dc8-7bdd-4839-8ef9-200da40e898c';

  async function loadOrderItems() {
    if (!orderId) return;
    try {
      const res = await fetch(`${GET_ITEMS_WEBHOOK}?order_id=${orderId}`);
      const data = await res.json();
      
      // تحديث بيانات الهيدر المرجعة من n8n
      if (data.customerName) document.getElementById('disp_customer_name').innerText = data.customerName;
      if (data.supplierName) document.getElementById('disp_supplier_name').innerText = data.supplierName;
      if (data.deliveryDate) document.getElementById('disp_delivery_date').innerText = data.deliveryDate;

      // تحديث صفوف الجدول
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = data.tableRows || '<tr><td colspan="6">لا توجد أصناف لهذا الأوردر</td></tr>';
    } catch (err) {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="6">تعذر جلب البيانات</td></tr>';
    }
  }

  loadOrderItems();

  // 3. إرسال البيانات المحددة إلى الـ Webhook الثاني (RECEIVE_WEBHOOK)
  document.getElementById('receiveForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    // تجميع العناصر المحددة للاستلام (غير المعطلة فقط أو الجديدة)
    const receiveBoxes = document.querySelectorAll('input[name="receive_item"]:checked:not(:disabled)');
    const dispatchBoxes = document.querySelectorAll('input[name="dispatch_item"]:checked:not(:disabled)');

    if (receiveBoxes.length === 0 && dispatchBoxes.length === 0) {
      return alert('يرجى تحديد صنف واحد على الأقل للاستلام أو الصرف!');
    }

    const receiveItems = Array.from(receiveBoxes).map(cb => JSON.parse(cb.value));
    const dispatchItems = Array.from(dispatchBoxes).map(cb => JSON.parse(cb.value));

    // رابط الـ Webhook الثاني للتخزين (ضع رابط Production المباشر هنا)
    const RECEIVE_WEBHOOK = 'https://saas123456.app.n8n.cloud/webhook/74055dc8-7bdd-4839-8ef9-200da40e899c';

    try {
      const response = await fetch(RECEIVE_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          order_id: orderId,
          action_date: document.getElementById('action_date').value,
          received_items: receiveItems,
          dispatched_items: dispatchItems
        })
      });

      if (response.ok) {
        alert('تم حفظ البيانات والتحديث بنجاح!');
        if (tg) tg.close();
      } else {
        alert('حدث خطأ أثناء حفظ البيانات، يرجى المحاولة لاحقاً.');
      }
    } catch (err) {
      alert('تعذر الاتصال بالسيرفر لتأكيد العملية.');
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استلام أصناف الأوردر</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap');
    body { font-family: 'Tajawal', sans-serif; background-color: #f4f6f9; margin: 0; padding: 12px; direction: rtl; }
    .form-card { background: #ffffff; padding: 18px; border-radius: 12px; max-width: 520px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 5px solid #8c6239; }
    .info-box { background-color: #faf8f5; border: 1px dashed #d1c2b2; border-radius: 8px; padding: 10px 14px; margin-bottom: 15px; font-size: 13px; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .info-label { font-weight: 700; color: #8c6239; }
    .receive-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .receive-table th { background-color: #8c6239; color: #ffffff; padding: 8px 5px; text-align: center; }
    .receive-table td { padding: 8px 5px; border: 1px solid #e0e0e0; text-align: center; }
    .btn-submit { width: 100%; background-color: #8c6239; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 20px; }
    .item-checkbox { width: 18px; height: 18px; accent-color: #8c6239; }
  </style>
</head>
<body>

<div class="form-card">
  <h2 style="text-align: center; color: #8c6239; margin-top: 0;">استلام أوردر</h2>

  <div class="info-box">
    <div class="info-row">
      <span><span class="info-label">رقم الأوردر:</span> <span id="disp_order_id">جاري التحميل...</span></span>
    </div>
  </div>

  <form id="receiveForm">
    <div style="margin-bottom: 10px;">
      <label style="font-weight:700; font-size: 12px;">تاريخ الاستلام / الصرف *</label>
      <input type="date" id="discharge_date" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;" required>
    </div>

    <table class="receive-table">
      <thead>
        <tr>
          <th>استلام</th>
          <th>م</th>
          <th>اسم الصنف</th>
          <th>الكمية</th>
          <th>الحالة</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5">جاري جلب أصناف الأوردر...</td></tr>
      </tbody>
    </table>

    <button type="submit" class="btn-submit" id="submitBtn">تأكيد استلام الأصناف</button>
  </form>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) tg.expand();
  document.getElementById('discharge_date').valueAsDate = new Date();

  // 1. قراءة رقم الأوردر من رابط الصفحة
  const urlParams = new URLSearchParams(window.location.search);
  const orderId = urlParams.get('order_id');
  document.getElementById('disp_order_id').innerText = orderId || 'غير محدد';

  // 2. جلب البيانات من n8n بناءً على رقم الأوردر
  const GET_ITEMS_WEBHOOK = 'https://saas123456.app.n8n.cloud/webhook/74055dc8-7bdd-4839-8ef9-200da40e897c';

  async function loadOrderItems() {
    if (!orderId) return;
    try {
      const res = await fetch(`${GET_ITEMS_WEBHOOK}?order_id=${orderId}`);
      const data = await res.json();
      
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = data.tableRows || '<tr><td colspan="5">لا توجد أصناف متاح استلامها</td></tr>';
    } catch (err) {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="5">تعذر جلب البيانات</td></tr>';
    }
  }

  loadOrderItems();

  // 3. إرسال الاستلام للـ Webhook الثاني
  document.getElementById('receiveForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const selectedBoxes = document.querySelectorAll('.item-checkbox:checked');
    if (selectedBoxes.length === 0) return alert('يرجى تحديد صنف واحد على الأقل!');

    const selectedItems = Array.from(selectedBoxes).map(cb => JSON.parse(cb.value));
    const RECEIVE_WEBHOOK = 'https://saas123456.app.n8n.cloud/webhook/74055dc8-7bdd-4839-8ef9-200da40e897c';

    const response = await fetch(RECEIVE_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        order_id: orderId,
        discharge_date: document.getElementById('discharge_date').value,
        received_items: selectedItems
      })
    });

    if (response.ok) {
      alert('تم إرسال البيانات بنجاح!');
      if (tg) tg.close();
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استلام أصناف الأوردر</title>
  <!-- مكتبة Telegram WebApp لتفاعل سلس مع البوت -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap');
    
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 12px;
      direction: rtl;
    }

    .form-card {
      background: #ffffff;
      padding: 18px;
      border-radius: 12px;
      max-width: 520px;
      margin: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-top: 5px solid #8c6239;
    }

    /* هيدر يحتوي على اللوجو والعنوان بتوسيط متناسق */
    .header-table {
      width: 100%;
      border-collapse: collapse;
      border-bottom: 2px solid #8c6239;
      margin-bottom: 15px;
      padding-bottom: 8px;
    }

    .header-table td {
      border: none !important;
      background: none !important;
      padding: 0 !important;
      vertical-align: middle;
    }

    .header-right {
      width: 25%;
      text-align: right;
    }

    .logo-img {
      max-height: 85px;
      width: auto;
      display: inline-block;
    }

    .header-center {
      width: 50%;
      text-align: center;
    }

    .header-center h2 {
      margin: 0;
      color: #8c6239;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
    }

    .header-left {
      width: 25%;
    }

    /* كارت تفاصيل الأوردر المباشرة */
    .info-box {
      background-color: #faf8f5;
      border: 1px dashed #d1c2b2;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .info-row:last-child { margin-bottom: 0; }
    .info-label { font-weight: 700; color: #8c6239; }
    .info-val { font-weight: 500; color: #333333; }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #8c6239;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 5px;
      margin: 15px 0 10px 0;
    }

    .form-group { margin-bottom: 10px; }
    label { display: block; font-weight: 700; font-size: 12px; margin-bottom: 3px; color: #333; }
    input[type="date"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 13px;
    }
    input[type="date"]:focus { border-color: #8c6239; outline: none; }

    /* جدول الأصناف والتحديد */
    .receive-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }

    .receive-table th {
      background-color: #8c6239;
      color: #ffffff;
      font-weight: 700;
      padding: 8px 5px;
      border: 1px solid #8c6239;
      text-align: center;
    }

    .receive-table td {
      padding: 8px 5px;
      border: 1px solid #e0e0e0;
      text-align: center;
      color: #333333;
      vertical-align: middle;
    }

    .receive-table tr:nth-child(even) {
      background-color: #faf8f5;
    }

    /* مكبّر مربعات الاختيار لتسهيل الضغط بالموبايل */
    .item-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #8c6239;
    }

    .btn-submit {
      width: 100%;
      background-color: #8c6239;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.2s;
    }
    .btn-submit:hover { background-color: #704d2b; }
  </style>
</head>
<body>

<div class="form-card">
  <!-- هيدر يحتوي على اللوجو المكبّر والعنوان -->
  <table class="header-table">
    <tr>
      <td class="header-right">
        <!-- ضع كود اللوجو الخاص بك (Base64) هنا -->
        <img class="logo-img" src="YOUR_BASE64_IMAGE_STRING_HERE" alt="Carpiture Logo" />
      </td>
      <td class="header-center">
        <h2>استلام أوردر</h2>
      </td>
      <td class="header-left"></td>
    </tr>
  </table>

  <!-- ملخص بيانات الأوردر -->
  <div class="info-box">
    <div class="info-row">
      <span><span class="info-label">رقم الأوردر:</span> <span class="info-val" id="disp_order_id">{{ $json["رقم الأوردر"] || "-" }}</span></span>
      <span><span class="info-label">تاريخ التسليم:</span> <span class="info-val">{{ $json["تاريخ التسليم"] || "-" }}</span></span>
    </div>
    <div class="info-row">
      <span><span class="info-label">اسم العميل:</span> <span class="info-val">{{ $json["اسم العميل"] || "-" }}</span></span>
      <span><span class="info-label">المورد:</span> <span class="info-val">{{ $json["المورد"] || "-" }}</span></span>
    </div>
  </div>

  <form id="receiveForm">
    <!-- حقل اختيار تاريخ الصرف / الاستلام -->
    <div class="form-group">
      <label>تاريخ الاستلام / الصرف *</label>
      <input type="date" id="discharge_date" required>
    </div>

    <!-- جدول اختيار الأصناف المستلمة -->
    <div class="section-title">الأصناف المتاحة للاستلام</div>
    
    <table class="receive-table">
      <thead>
        <tr>
          <th style="width: 12%;">استلام</th>
          <th style="width: 10%;">م</th>
          <th style="width: 48%;">اسم الصنف</th>
          <th style="width: 15%;">الكمية</th>
          <th style="width: 15%;">الحالة</th>
        </tr>
      </thead>
      <tbody>
        <!-- يتم زرع صفوف الأصناف التي تحتوي على الـ Checkbox من عقدة الـ Code -->
        {{{ $json.tableRows }}}
      </tbody>
    </table>

    <button type="submit" class="btn-submit" id="submitBtn">تأكيد استلام الأصناف</button>
  </form>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) tg.expand();

  // ضبط تاريخ اليوم تلقائياً بحقل تاريخ الاستلام
  document.getElementById('discharge_date').valueAsDate = new Date();

  // معالجة إرسال استمارة الاستلام
  document.getElementById('receiveForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    
    // 1. جمع الأصناف التي تم تعليمها بـ Checkbox فقط
    const selectedBoxes = document.querySelectorAll('.item-checkbox:checked');
    
    if (selectedBoxes.length === 0) {
      alert('يرجى تحديد صنف واحد على الأقل لاستلامه!');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = 'جاري تسجيل الاستلام...';

    const selectedItemsPayload = [];
    selectedBoxes.forEach(box => {
      try {
        selectedItemsPayload.push(JSON.parse(box.value));
      } catch (err) {
        console.error("Error parsing item data:", err);
      }
    });

    // 2. إعداد كائن البيانات المرسل للـ Webhook
    const payload = {
      order_id: document.getElementById('disp_order_id').innerText.trim(),
      discharge_date: document.getElementById('discharge_date').value,
      received_items: selectedItemsPayload
    };

    // رابط الـ Webhook الخاص باستلام وتحديث Google Sheets (Webhook 2)
    const receiveWebhookUrl = 'https://saas123456.app.n8n.cloud/webhook-test/https://saas123456.app.n8n.cloud/webhook-test/74055dc8-7bdd-4839-8ef9-200da40e897c';

    try {
      const response = await fetch(receiveWebhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        alert('تم تسجيل استلام الأصناف المحددة بنجاح!');
        if (tg) tg.close();
      } else {
        alert('حدث خطأ أثناء إرسال بيانات الاستلام.');
      }
    } catch (err) {
      alert('تعذر الاتصال بسيرفر n8n.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = 'تأكيد استلام الأصناف';
    }
  });
</script>

</body>
</html>
